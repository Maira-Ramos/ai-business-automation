[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-business-automation"
version = "2.0.0"
description = "AI Business Automation Platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.100.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "typer>=0.16",
    "rich>=14.1",
    "loguru>=0.7.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "black>=25.1",
    "ruff>=0.12",
    "mypy>=1.17"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
aiba = "ai_business_automation.interfaces.cli.main:app"